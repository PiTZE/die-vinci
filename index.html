<!doctype html>
<html lang="en" data-theme="modus-vivendi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A game about Leo." />
    <meta name="theme-color" content="#000000" />
    <!-- Installed on iOS, where there is no fullscreen mode. Translucent means
         the page runs under the status bar rather than below a bar in a colour
         of its own choosing; the safe-area insets keep content out of it. -->
    <!-- The modern spelling first. Chrome deprecated the Apple one and says so
         in the console on every load; Safari still reads only the Apple one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>die Vinci</title>
    <script>
      // Runs before first paint so the theme never flashes. Mirrors the logic
      // in src/ui/theme.ts; keep the two in step.
      (function () {
        var root = document.documentElement
        var id = 'modus-vivendi'
        try {
          id = localStorage.getItem('leonardos-die-theme') || id
          var raw = localStorage.getItem('leonardos-die-theme-vars')
          if (raw) {
            var vars = JSON.parse(raw)
            for (var k in vars) root.style.setProperty('--' + k, vars[k])
          }
        } catch (e) {}
        root.dataset.theme = id
        root.style.colorScheme = id === 'modus-operandi' ? 'light' : 'dark'
      })()
    </script>
    <link rel="icon" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" sizes="192x192" href="/icon-192.png" />
    <!--
      iOS reads this one, and it is fussy about the size in a way nothing else
      is: Apple documents 180x180 for an iPhone at 3x, and an install offered
      only 192 and 512 can end up on the home screen with no icon at all rather
      than a scaled one. Reported by somebody who installed it and got a blank
      tile. The sizes attribute is what lets iOS pick without guessing.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icon-120.png" />
    <!-- The name under the icon, which otherwise comes from <title>. -->
    <meta name="apple-mobile-web-app-title" content="die Vinci" />
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <div id="app" class="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
